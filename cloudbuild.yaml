steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/nutex-app:$SHORT_SHA', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/nutex-app:$SHORT_SHA']
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - run
    - deploy
    - nutex-app
    - --image=gcr.io/$PROJECT_ID/nutex-app:$SHORT_SHA
    - --region=us-central1
    - --platform=managed
    - --allow-unauthenticated
    - --set-env-vars=NODE_ENV=production
images:
- 'gcr.io/$PROJECT_ID/nutex-app:$SHORT_SHA'
